
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weird Glossary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .term {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .term h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .term p {
            margin-top: 0;
        }

        #count {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Weird Glossary :D </h1>

        <label for="search">Search Terms:</label>
        <input
            type="text"
            id="search"
            placeholder="Type to search..."
        >

        <p id="count"></p>

        <div id="glossary"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
